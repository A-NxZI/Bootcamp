<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Document</title>
</head>
    <body>
        <div class="container">
            <!-- title -->
            <div class="row text-center">
                <h1>JavaScript Practice 1</h1>
            </div>

            <!-- input name -->
            <div class="row justify-content-center mt-4">
                <div class="col-4">
                    <div class="input-group">
                        <input type="text" class="form-control" id="first-name" placeholder="first name" aria-placeholder="first name">
                    </div>
                </div>
                <div class="col-4">
                    <div class="input-group">
                        <input type="text" class="form-control" id="last-name" placeholder="last name" aria-placeholder="last name">
                    </div>
                </div>
            </div>

            <!-- button -->
            <div class="row justify-content-center mt-4">
                <button type="button" class="btn btn-primary col-2" id="button_merge">merge</button>
            </div>

            <div class="text-center mt-4">
                <span id="full-name">fullname</span>
            </div>
        </div>
    </body>
     <script src="2fPractice.js"> </script>
     <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
