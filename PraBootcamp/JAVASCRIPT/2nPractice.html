<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>2nPractice</title>
</head>
<body>
    <div class="container">
        <div class="text-center">
            <h1>JavaScript Practice 3</h1>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-2">
                <div class="input-group">
                    <input type="text" class="form-control" id="number-1">
                </div>
            </div>
            <div class="col-2">
                <div class="input-group">
                    <select class="form-select" name="aritmatika" id="aritmatika">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">*</option>
                        <option value="/">/</option>
                        <option value="%">%</option>
                        <option value="**">**</option>
                    </select>
                </div>
            </div>
            <div class="col-2">
                <div class="input-group">
                    <input class="form-control" type="number" id="number-2">
                </div>
            </div>
            <div class="col-2">
                <div class="input-group">
                    <button class="btn btn-primary" type="button" id="button-equation">Equals</button>
                </div>
            </div>
            <div class="col-3">
                <div class="input-group">
                    <span class="mx-4" id="result" name="result">Result</span>
                </div>
            </div>
        </div>
    </div>
    <!-- operation logic -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-2">
                <div class="input-group">
                    <input type="text" class="form-control" id="numero-1">
                </div>
            </div>
            <div class="col-2">
                <div class="input-group">
                    <select class="form-select" name="e" id="e">
                        <option value="||">||</option>
                        <option value="&&">&&</option>
                    </select>
                </div>
            </div>
            <div class="col-2">
                <div class="input-group">
                    <input class="form-control" type="number" id="numero-2">
                </div>
            </div>
            <div class="col-2">
                <div class="input-group">
                    <button class="btn btn-primary" type="button" id="button-e">logic</button>
                </div>
            </div>
            <div class="col-3">
                <div class="input-group">
                    <span class="mx-4" id="result1" name="result1">Result</span>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="2nPractice.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</html>
