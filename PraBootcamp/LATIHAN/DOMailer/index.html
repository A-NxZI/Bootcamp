<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container">
        <div>
            <div class="mb-5">
                <div class="row">
                    <h1>
                        Domailer
                    </h1>
                    <h4 id="a1">
                        Unread : <span class="a1a">0</span> | Stared : <span class="a1b">0</span>
                    </h4>
                </div>
                <hr>
                <div clas="row item-group">
                    <input type="text" class="form" placeholder="Search by sender or subject..." id="b1">
                    <div class="d-flex gap-2" id="b2"></div>
                    <button class="theme-primary btn-solid" data-filter="b2a">All</button>
                    <button class="theme-primary btn-outline" datafilter="b2b">Unread</button>
                    <button class="theme-primary btn-outline" datafilter="b2c">Starred</button>
                    <button class="theme-primary btn-outline" datafilter="b2d">+ comopse</button>
                </div>
                <div class="card card-row mb-5 mt-5">
                    <div class="card-body">
                         <h5 id="c1"><b>0</b> Item(s) Selected</h5>
                        <button class="theme-primary btn-solid" id="c2">Mark as Read</button>
                        <button class="theme-danger btn-solid" id="c3">Delete</button>
                    </div>
                </div>
                <div class="text-center" id="d1">
                    <h5>There's no email  yet</h5>
                </div>
            </div>
        </div>
    </div>
</body>
    <script src="script.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</html>
