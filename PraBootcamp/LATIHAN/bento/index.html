<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Bento Box — Layout Wireframe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <div class="bento-container">

      <section class="bento-box box-gohan">
        <span class="box-number">1</span>
        <div class="box-text">
          <h2 class="box-title">Gohan</h2>
          <p class="box-desc">Main rice · 2 kolom × 1 baris</p>
        </div>
      </section>

      <section class="bento-box box-skewer">
        <span class="box-number">2</span>
        <div class="box-text">
          <h2 class="box-title">Side Skewer</h2>
          <p class="box-desc">Tall dish · 1 kolom × 2 baris</p>
        </div>
      </section>

      <section class="bento-box box-okazu">
        <span class="box-number">3</span>
        <div class="box-text">
          <h2 class="box-title">Okazu</h2>
          <p class="box-desc">Main protein · 1 kolom × 1 baris</p>
        </div>
      </section>

      <section class="bento-box box-tsukemono">
        <span class="box-number">4</span>
        <div class="box-text">
          <h2 class="box-title">Tsukemono &amp; Dessert</h2>
          <p class="box-desc">Square box · 1 kolom × 1 baris</p>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
